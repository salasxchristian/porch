name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # media_kit's CMake downloads its prebuilt archives from release URLs
      # that keep returning 504. Fetch them through the API instead; CMake
      # skips its own download when a file with the expected MD5 is in place.
      - name: Prefetch media_kit archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = @(
            @{ repo = 'alexmercerind/flutter-windows-ANGLE-OpenGL-ES'; tag = 'v1.0.1'; name = 'ANGLE.7z'; md5 = 'e866f13e8d552348058afaafe869b1ed' },
            @{ repo = 'media-kit/libmpv-win32-video-build'; tag = '2023-09-24'; name = 'mpv-dev-x86_64-20230924-git-652a1dd.7z'; md5 = 'a832ef24b3a6ff97cd2560b5b9d04cd8' }
          )
          New-Item -ItemType Directory -Force build/windows/x64 | Out-Null
          foreach ($a in $archives) {
            $out = "build/windows/x64/$($a.name)"
            $filter = '.assets[] | select(.name == "' + $a.name + '") | .id'
            $id = gh api "repos/$($a.repo)/releases/tags/$($a.tag)" --jq $filter
            curl.exe -fsSL --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' -o $out "https://api.github.com/repos/$($a.repo)/releases/assets/$id"
            $md5 = (Get-FileHash -Algorithm MD5 $out).Hash.ToLower()
            if ($md5 -ne $a.md5) { throw "$($a.name) MD5 mismatch: $md5" }
          }
      - run: flutter build windows --release
      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Porch-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Porch-windows-x64
          path: Porch-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Porch-windows-x64.zip
