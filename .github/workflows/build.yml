name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # media_kit's CMake downloads ANGLE.7z from a release URL that keeps
      # returning 504. Fetch it through the API instead; CMake skips its own
      # download when a file with the expected MD5 is already in place.
      - name: Prefetch ANGLE for media_kit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = 'alexmercerind/flutter-windows-ANGLE-OpenGL-ES'
          $id = gh api "repos/$repo/releases/tags/v1.0.1" --jq '.assets[] | select(.name=="ANGLE.7z") | .id'
          New-Item -ItemType Directory -Force build/windows/x64 | Out-Null
          curl.exe -fsSL --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' -o build/windows/x64/ANGLE.7z "https://api.github.com/repos/$repo/releases/assets/$id"
          $md5 = (Get-FileHash -Algorithm MD5 build/windows/x64/ANGLE.7z).Hash.ToLower()
          if ($md5 -ne 'e866f13e8d552348058afaafe869b1ed') { throw "ANGLE.7z MD5 mismatch: $md5" }
      - run: flutter build windows --release
      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Porch-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Porch-windows-x64
          path: Porch-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Porch-windows-x64.zip
